<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лента открытий</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<header class="header">
    <div class="header-inner">
      <img src="itmo-logo.png" alt="ИТМО" class="header-logo" />
      <div>
        <h1 class="header-title">Лента открытий</h1>
        <p class="header-sub">Наука и техника России</p>
      </div>
    </div>
    <div id="user-info" class="user-info"></div>
  </header>

  <!-- Новый блок фильтрации -->
  <nav class="filter-nav">
    <div id="filter-buttons" class="filter-buttons">
      <button class="filter-btn active" data-epoch="all">Все эпохи</button>
    </div>
  </nav>

  <main id="timeline-container" class="timeline-container">
    <div class="loader">
      <div class="spinner"></div>
      <p>Загружаем открытия...</p>
    </div>
  </main>

  <script src="timeline.js"></script>
</body>
</html>
